# docker compose up -d   →   http://localhost:8080
services:
  redstring:
    build: .
    image: redstring:local
    container_name: redstring
    ports:
      - "8080:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
