<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redstring</title>
<meta name="description" content="Redstring — özel araştırmacılar için vaka dosyası sistemi: taraflar, delil zinciri, kronoloji, saha mesaisi ve bağlantı şeması. Case management for private investigators; runs entirely in the browser.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23181B21'/%3E%3Cpath d='M5 10h9l2 3h11v12H5z' fill='none' stroke='%23A8322D' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19' r='3' fill='none' stroke='%23A8322D' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Redstring</h1>
      <span class="tag" id="brandTag"></span>
    </div>
    <div class="stats" id="topStats"></div>
    <div class="topactions">
      <button class="btn ghost sm langbtn" id="langBtn"></button>
      <button class="btn ghost sm" id="themeBtn" aria-label="Theme">◐</button>
      <button class="btn ghost sm" id="dataBtn"></button>
      <button class="btn primary" id="newCaseBtn"></button>
    </div>
  </header>

  <div class="layout">
    <aside class="rail">
      <div class="rail-head">
        <input class="search" id="search" type="search">
        <div class="filters" id="filters" role="group"></div>
      </div>
      <ul id="caseList"></ul>
      <footer class="rail-foot" id="railFoot"></footer>
    </aside>
    <main class="main"><div class="wrap" id="dossier"></div></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="assets/i18n.js"></script>
<script src="assets/sample.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
